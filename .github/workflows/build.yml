name: Build exe

on:
  push:
    tags: ["v*"]          # git tag v1.1.0 && git push --tags  →  релиз с exe
  workflow_dispatch:       # или кнопка «Run workflow» во вкладке Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build PCTime.exe
        run: >
          python -m PyInstaller --noconfirm --clean --noconsole --onefile
          --name PCTime --icon assets/icon.ico --version-file version_info.txt pc_time.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter PCTime-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Out-File dist/SHA256.txt -Encoding ascii
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PCTime
          path: |
            dist/PCTime-Setup-*.exe
            dist/SHA256.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PCTime-Setup-*.exe
            dist/SHA256.txt
